<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud-Veyon Master Dashboard</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="/socket.io/socket.io.js"></script>

  <style>
    /* CRUD MODALS & TOOLBAR STYLES */
    .crud-btn-user {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      border: 1px solid #fbbf24 !important;
      color: white !important;
    }
    .crud-btn-device {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      border: 1px solid #34d399 !important;
      color: white !important;
    }
    .mgmt-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center; justify-content: center;
      z-index: 10000;
    }
    .mgmt-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 90%; max-width: 850px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      color: white;
    }
    .mgmt-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px;
    }
    .mgmt-header h2 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
    .mgmt-table {
      width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px;
    }
    .mgmt-table th, .mgmt-table td {
      padding: 10px 12px; text-align: left; border-bottom: 1px solid #334155;
    }
    .mgmt-table th { background: #0f172a; color: #94a3b8; }
    .mgmt-table tr:hover { background: rgba(51, 65, 85, 0.5); }
    .form-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155;
    }
    .form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid #475569;
      color: white; border-radius: 6px; outline: none; font-size: 13px; box-sizing: border-box;
    }
    .btn-action-add {
      grid-column: 1 / -1; background: #0284c7; color: white; border: none;
      padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-action-add:hover { background: #0369a1; }
    .btn-delete {
      background: #ef4444; color: white; border: none; padding: 5px 10px;
      border-radius: 4px; cursor: pointer; font-size: 11px;
    }
    .btn-delete:hover { background: #dc2626; }
    .badge-role {
      padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold;
    }
    .role-admin { background: #7c2d12; color: #fdba74; }
    .role-teacher { background: #1e3a8a; color: #93c5fd; }
    .role-student { background: #064e3b; color: #6ee7b7; }
  </style>
</head>
<body>

  <!-- =========================================
       1. VEYON TOP RIBBON TOOLBAR
       ========================================= -->
      <!-- SMART BACK BUTTON -->
      <button class="btn-mini" onclick="smartGoBack()" style="background: #1e293b; border: 1px solid #475569; padding: 6px 14px; display: flex; align-items: center; gap: 6px; color: #38bdf8; font-weight: bold; cursor: pointer;" title="ወደ ኋላ ተመለስ">
        <i class="fa-solid fa-arrow-left"></i> ተመለስ (Back)
      </button>

  <div class="veyon-ribbon">
    <button class="tool-btn active" id="btn-monitoring">
      <i class="fa-solid fa-desktop" style="color: #38bdf8;"></i>
      <span>Monitoring</span>
    </button>

    <button class="tool-btn" onclick="startTeacherBroadcast()" style="background: linear-gradient(135deg, #0284c7, #0369a1); border: 1px solid #38bdf8; color: white;">
      <i class="fa-solid fa-chalkboard-user"></i>
      <span>Demonstration</span>
    </button>

    <!-- አዲሱ File Transfer በተን -->
    <button class="tool-btn" onclick="openFileTransferModal()" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); border: 1px solid #c4b5fd; color: white;">
      <i class="fa-solid fa-file-arrow-up"></i>
      <span>Send File</span>
    </button>

    <div class="toolbar-divider"></div>

    <!-- አዲሶቹ የ CRUD ማኔጅመንት አዝራሮች -->
    <button class="tool-btn crud-btn-user" onclick="openUsersModal()">
      <i class="fa-solid fa-users-gear"></i>
      <span>Users CRUD</span>
    </button>

    <button class="tool-btn crud-btn-device" onclick="openDevicesModal()">
      <i class="fa-solid fa-network-wired"></i>
      <span>Devices CRUD</span>
    </button>

    <div class="toolbar-divider"></div>

    <button class="tool-btn" id="btn-lock" onclick="triggerBroadcast('LOCK')">
      <i class="fa-solid fa-lock" style="color: #ef4444;"></i>
      <span>Lock</span>
    </button>

    <button class="tool-btn" id="btn-unlock" onclick="triggerBroadcast('UNLOCK')">
      <i class="fa-solid fa-lock-open" style="color: #22c55e;"></i>
      <span>Unlock</span>
    </button>

    <button class="tool-btn" id="btn-message" onclick="openMessageModal()">
      <i class="fa-solid fa-comment-dots" style="color: #facc15;"></i>
      <span>Message</span>
    </button>

    <div class="toolbar-divider"></div>

    <button class="tool-btn danger" id="btn-reboot" onclick="triggerBroadcast('REBOOT')">
      <i class="fa-solid fa-rotate-right"></i>
      <span>Reboot</span>
    </button>

    <button class="tool-btn danger" id="btn-power" onclick="triggerBroadcast('POWER_OFF')">
      <i class="fa-solid fa-power-off"></i>
      <span>Power Off</span>
    </button>
  </div>

  <!-- አድሚኑ ወደ መምህሩ ክፍል መመልከቻ -->
    <a href="/teacher.html" class="tool-btn" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: 1px solid #60a5fa; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <i class="fa-solid fa-chalkboard-user"></i>
      <span>Teacher View</span>
    </a>

  <!-- አዲሱ LOGOUT አዝራር (በቀኝ በኩል አምሮ እንዲቀመጥ) -->
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 13px; color: #fbbf24; font-weight: bold;">
        <i class="fa-solid fa-user-shield"></i> Admin
      </span>
      <button class="tool-btn danger" onclick="handleLogout()" style="background: #334155 !important; border: 1px solid #64748b !important; padding: 6px 14px; min-width: auto; height: 38px;">
        <i class="fa-solid fa-arrow-right-from-bracket" style="color: #f87171;"></i>
        <span>Logout</span>
      </button>
    </div>

  <!-- =========================================
       2. ADMIN WORKSPACE: TEACHERS INSPECTION (የመምህራን ክፍል ክትትል)
       ========================================= -->
  <div class="workspace">
    <div class="workspace-header">
      <div>
        <h2 style="font-size: 20px; color: #f8fafc; display: flex; align-items: center; gap: 10px;">
          <i class="fa-solid fa-chalkboard-user" style="color: #38bdf8;"></i> የላብራቶሪ መምህራን ክፍሎች (Teachers Labs)
        </h2>
        <span style="font-size: 13px; color: #94a3b8;" id="teachers-count">የተመዘገቡ መምህራን፡ 0</span>
      </div>

      <!-- መምህራን መፈለጊያ Search Bar -->
      <div style="display: flex; gap: 12px; align-items: center;">
        <div style="position: relative;">
          <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 11px; color: #64748b;"></i>
          <input type="text" id="teacherSearchInput" onkeyup="filterTeachers()" placeholder="መምህር በስም ፈልግ..." 
                 style="padding: 8px 12px 8px 35px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; outline: none; width: 220px; font-size: 13px;">
        </div>
        <button class="btn-mini" onclick="loadTeachersList()" style="padding: 8px 14px;">
          <i class="fa-solid fa-arrows-rotate"></i> አድስ
        </button>
      </div>
    </div>

    <!-- የመምህራን ካርዶች መደርደሪያ Grid -->
    <div class="devices-grid" id="teachersGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px 0;">
      <!-- ጃቫስክሪፕት መምህራንን እዚህ ይደረድራቸዋል -->
    </div>
  </div>
  
  <!-- =========================================
       3. USERS CRUD MANAGEMENT MODAL
       ========================================= -->
  <div class="mgmt-modal" id="usersModal">
    <div class="mgmt-card">
      <div class="mgmt-header">
        <h2 style="color: #fbbf24;"><i class="fa-solid fa-users-gear"></i> የተጠቃሚዎች ማኔጅመንት (Users CRUD)</h2>
        <button onclick="closeUsersModal()" class="btn-delete" style="font-size: 16px; padding: 4px 10px;">✕</button>
      </div>

      <!-- አዲስ ተጠቃሚ መመዝገቢያ ፎርም -->
      <form id="addUserForm" onsubmit="handleCreateUser(event)" class="form-grid">
        <div class="form-group">
          <label>ሙሉ ስም (Full Name)</label>
          <input type="text" id="userFullName" placeholder="Abebe Kebede" required>
        </div>
        <div class="form-group">
          <label>ኢሜይል (Email)</label>
          <input type="email" id="userEmail" placeholder="abebe@veyon.com" required>
        </div>
        <div class="form-group">
          <label>የይለፍ ቃል (Password)</label>
          <input type="password" id="userPassword" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>ሚና (Role)</label>
          <select id="userRole">
            <option value="student">Student (ተማሪ)</option>
            <option value="teacher">Teacher (መምህር)</option>
            <option value="admin">Admin (አስተዳዳሪ)</option>
          </select>
        </div>
        <button type="submit" class="btn-action-add" style="background:#d97706;">
          <i class="fa-solid fa-user-plus"></i> አዲስ ተጠቃሚ መዝግብ (Add User)
        </button>
      </form>

      <!-- የተጠቃሚዎች ዝርዝር ሠንጠረዥ -->
      <table class="mgmt-table">
        <thead>
          <tr>
            <th>ስም</th>
            <th>ኢሜይል</th>
            <th>Role</th>
            <th>ድርጊት</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- ጃቫስክሪፕት እዚህ ይሞላዋል -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- =========================================
       4. DEVICES CRUD MANAGEMENT MODAL
       ========================================= -->
  <div class="mgmt-modal" id="devicesModal">
    <div class="mgmt-card">
      <div class="mgmt-header">
        <h2 style="color: #34d399;"><i class="fa-solid fa-network-wired"></i> የመሳሪያዎች ማኔጅመንት (Devices CRUD)</h2>
        <button onclick="closeDevicesModal()" class="btn-delete" style="font-size: 16px; padding: 4px 10px;">✕</button>
      </div>

      <!-- አዲስ መሣሪያ መመዝገቢያ ፎርም -->
      <form id="addDeviceForm" onsubmit="handleCreateDevice(event)" class="form-grid">
        <div class="form-group">
          <label>የመሳሪያ ስም (Device Name)</label>
          <input type="text" id="devName" placeholder="Lab-1 PC-01" required>
        </div>
        <div class="form-group">
          <label>MAC Address</label>
          <input type="text" id="devMac" placeholder="00:1A:2B:3C:4D:5E">
        </div>
        <div class="form-group">
          <label>IP Address</label>
          <input type="text" id="devIp" placeholder="192.168.1.50">
        </div>
        <div class="form-group">
          <label>Serial Number</label>
          <input type="text" id="devSerial" placeholder="SN-9823472">
        </div>
        <div class="form-group">
          <label>OS Type</label>
          <select id="devOs">
            <option value="Windows">Windows PC</option>
            <option value="Android">Android Phone</option>
            <option value="Linux">Linux</option>
          </select>
        </div>
        <div class="form-group">
          <label>የላብ ክፍል (Room)</label>
          <input type="text" id="devRoom" placeholder="Lab 101" value="Main Lab">
        </div>
        <button type="submit" class="btn-action-add" style="background:#059669;">
          <i class="fa-solid fa-plus"></i> አዲስ መሣሪያ መዝግብ (Register Device)
        </button>
      </form>

      <!-- የተመዘገቡ መሣሪያዎች ዝርዝር ሠንጠረዥ -->
      <table class="mgmt-table">
        <thead>
          <tr>
            <th>ስም</th>
            <th>OS</th>
            <th>IP Address</th>
            <th>MAC Address</th>
            <th>ክፍል</th>
            <th>ሁኔታ</th>
            <th>ድርጊት</th>
          </tr>
        </thead>
        <tbody id="devicesTableBody">
          <!-- ጃቫስክሪፕት እዚህ ይሞላዋል -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- =========================================
       5. MESSAGE POPUP MODAL
       ========================================= -->
  <div class="modal-overlay" id="msgModal">
    <div class="modal-card">
      <h3 style="color: #38bdf8; margin-bottom: 10px;">💬 ወደ ተማሪዎች መልእክት ላክ</h3>
      <textarea id="msgInput" placeholder="የመልእክት ጽሁፍ እዚህ ያስገቡ..."></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn-mini" onclick="closeMessageModal()" style="background:#475569;">ሰርዝ</button>
        <button class="btn-mini" onclick="sendMessageBroadcast()" style="background:#0284c7; font-weight:bold;">ላክ</button>
      </div>
    </div>
  </div>

<!-- FILE TRANSFER MODAL -->
  <div class="mgmt-modal" id="fileTransferModal">
    <div class="mgmt-card" style="max-width: 500px;">
      <div class="mgmt-header">
        <h2 style="color: #c4b5fd;"><i class="fa-solid fa-file-arrow-up"></i> ለተማሪዎች ፋይል መላኪያ (File Transfer)</h2>
        <button onclick="closeFileTransferModal()" class="btn-delete" style="font-size: 16px; padding: 4px 10px;">✕</button>
      </div>
      <div style="background: #0f172a; padding: 20px; border-radius: 10px; border: 1px dashed #64748b; text-align: center;">
        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 42px; color: #8b5cf6; margin-bottom: 10px; display:block;"></i>
        <p style="font-size: 14px; margin-bottom: 15px;">PDF፣ የፈተና ጥያቄ ወይም ዶክመንት ይምረጡ</p>
        <input type="file" id="fileToSend" style="color: white; margin-bottom: 15px;">
        <button class="btn-action-add" style="background:#7c3aed; width:100%;" onclick="sendFileToStudents()">
          <i class="fa-solid fa-paper-plane"></i> ለሁሉም ተማሪዎች ላክ (Broadcast File)
        </button>
      </div>
    </div>
  </div>

  <!-- Dashboard Logic Script -->
  <script src="js/dashboard.js"></script>
  <script>
    function handleLogout() {
      // የተቀመጠውን የአድሚን ዳታ ከብራውዘር ማጽዳት
      localStorage.removeItem('currentUser');
      // በቀጥታ ወደ Login ገጽ መላክ
      window.location.href = '/login.html';
    }

  function smartGoBack() {
      // index.html ላይ እያለህ የትም እንዳይሄድ እዚያው እንዲረጋጋ ማድረግ
      const currentPath = window.location.pathname;
      if (currentPath === '/index.html' || currentPath === '/') {
        console.log("አሁን በዋናው Admin ገጽ ላይ ነዎት።");
        return; // ምንም አያደርግም፣ እዚያው ይቀራል!
      }
      window.location.href = '/index.html';
    }
  </script>
</body>
</html>
