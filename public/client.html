<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Device Simulator (ተማሪ / ስልክ)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .device-box {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #334155;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #064e3b;
      color: #34d399;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    input {
      width: 90%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
      margin-bottom: 12px;
      text-align: center;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      width: 90%;
      margin-bottom: 10px;
      transition: 0.2s;
    }
    button:hover { background: #0369a1; }

    .btn-share {
      background: #16a34a !important;
    }
    .btn-share:hover { background: #15803d !important; }

    /* =========================================
       1. ሙሉ ስክሪን ቆላፊ መጋረጃ (LOCK OVERLAY)
       ========================================= */
    #lockOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(220, 38, 38, 0.96);
      color: white;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      backdrop-filter: blur(8px);
    }
    #lockOverlay i {
      font-size: 90px;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* =========================================
       2. መልእክት ማሳያ ሳጥን (TEXT MESSAGE MODAL)
       ========================================= */
    #msgAlert {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #facc15;
      color: #0f172a;
      padding: 16px 28px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 17px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: none;
      z-index: 100000;
      border: 2px solid #ca8a04;
      animation: slideDown 0.4s ease;
    }
    @keyframes slideDown {
      from { top: -60px; opacity: 0; }
      to { top: 25px; opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- ስክሪን ሲቆለፍ የሚወጣ ሙሉ መጋረጃ -->
  <div id="lockOverlay">
    <i class="fa-solid fa-lock"></i>
    <h1 style="margin: 0; font-size: 36px;">ስክሪኑ ተቆልፏል!</h1>
    <p style="font-size: 18px; margin-top: 12px; color: #fee2e2;">ይህ ኮምፒውተር/ስልክ በአስተዳዳሪው ታግዷል።</p>
  </div>

  <!-- የአስተዳዳሪው መልእክት ማሳያ -->
  <div id="msgAlert">
    <i class="fa-solid fa-bell"></i> <span id="msgAlertText">መልእክት እዚህ ይወጣል</span>
  </div>

  <div class="device-box">
    <div class="status-badge">
      <i class="fa-solid fa-circle-check"></i> ከ Cloud-Veyon ጋር ተገናኝቷል
    </div>
    
    <h2 style="margin-bottom: 5px;">📱 Target Device</h2>
    <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">ይህ ገጽ የተማሪ ኮምፒውተር ወይም ስልክ ሆኖ ያገለግላል።</p>

    <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px;">የመሳሪያው ስም (Device Name)፦</label>
    <input type="text" id="deviceNameInput" value="የዮሐንስ ኮምፒውተር">
    <button onclick="updateDeviceName()">ስሙን አድስ (Update)</button>

    <!-- ትክክለኛ ስክሪን ማጋሪያ አዲሱ በተን -->
    <button id="shareScreenBtn" class="btn-share" onclick="startScreenShare()">
      <i class="fa-solid fa-desktop"></i> እውነተኛ ስክሪን አጋራ (Start Screen Share)
    </button>

    <!-- በድብቅ ስክሪኑን የሚይዝ ቪዲዮ -->
    <!-- አዲሱ (ጥቁር ምስል እንዳይሆን የሚያደርገው) -->
<video id="localVideo" autoplay playsinline muted style="position: absolute; opacity: 0; pointer-events: none; z-index: -1; width: 640px; height: 360px;"></video>
    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #334155; font-size: 12px; color: #64748b;">
      <p>💡 "እውነተኛ ስክሪን አጋራ" የሚለውን ተጭነህ ስክሪንህን ስትመርጥ በዳሽቦርዱ CCTV ላይ በቀጥታ ይታያል!</p>
    </div>
  </div>

  <script src="js/client.js"></script>
</body>
</html>
